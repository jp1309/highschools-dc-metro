name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Validate published data
        run: python scripts/validate_data.py

      - name: Validate middle-school data
        run: python middle-schools/scripts/validate_data.py

      - name: Validate middle-school boundaries
        run: python middle-schools/scripts/validate_boundaries.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run middle-school unit tests
        run: python -m unittest discover -s middle-schools/tests -v

      - name: Build static artifact
        run: python scripts/build_site.py
